services:
  postgresql:
    container_name: postgresql-servidor
    image: postgres:15.4-bullseye
    ports:
      - "5433:5432"
    networks:
      - mired
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      # PGDATA va en un volumen nombrado de Docker, no en un bind mount del
      # proyecto. PostgreSQL no soporta su directorio de datos sobre un sistema
      # de archivos de Windows: con un bind mount los procesos backend mueren
      # con "exited with exit code 2" apenas una consulta toca el disco, y el
      # cluster queda en un bucle infinito de recuperacion que rechaza todas las
      # conexiones con SQLSTATE 57P03. Con volumen nombrado funciona igual en
      # Windows y en Linux.
      - pgdata:/var/lib/postgresql/data
      # Los scripts de inicializacion si pueden seguir viniendo del proyecto:
      # solo se leen una vez, al crear el cluster.
      - ./sql:/docker-entrypoint-initdb.d:ro
    restart: "no"
  app:
    container_name: app-servidor
    build: .
    ports:
      - "8080:8080"
    networks:
      - mired
    environment:
      - PORT=8080
      - DB_HOST=postgresql
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_PORT=5432
      - DB_SSLMODE=disable
    depends_on:
      postgresql:
        condition: service_healthy
    restart: "no"
networks:
  mired:
    external: true
volumes:
  pgdata:
