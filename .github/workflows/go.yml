name: Go

# master es la rama por defecto del repositorio y develop la de integracion.
# El workflow declaraba unicamente "main", que no existe aca: por eso GitHub
# Actions no tenia ni una sola ejecucion en el repositorio, y ningun pull
# request contra master ni contra develop disparaba el pipeline.
on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Vet
      run: go vet ./...
